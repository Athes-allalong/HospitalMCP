{% extends "base.html" %}
{% block title %}Confirm{% endblock %}
{% block page_title %}Please confirm{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card border-warning shadow-sm">
    <div class="card-header bg-warning-subtle fw-semibold"><i class="bi bi-shield-check me-1"></i>{{ title }}: review before anything changes</div>
    <div class="card-body">
      {% include "_preview.html" %}
      <form method="post" action="{{ url_for('action_confirm', pid=pid) }}" class="d-flex gap-2 mt-3">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}"/>
        <button class="btn btn-success" name="decision" value="confirm"><i class="bi bi-check-lg me-1"></i>Confirm</button>
        <button class="btn btn-outline-secondary" name="decision" value="cancel">Cancel</button>
      </form>
      <div class="small text-muted mt-2">This confirmation expires in 5 minutes and works once.</div>
    </div></div>
</div></div>
{% endblock %}
